bufr:
  group_by_variable: prepbufrDataLevelCategory
  subsets:
  - PROFLR
  variables:
    observationType:
      query: '*/TYP'
    prepbufrDataLevelCategory:
      query: '*/PRSLEVEL/CAT'
    timestamp:
      timeoffset:
        timeOffset: '*/PRSLEVEL/DRFTINFO/HRDR'
        transforms:
        - scale: 3600
        referenceTime: '1970-01-01T00:00:00Z'
    obsTimeMinusCycleTime:
      query: '*/PRSLEVEL/DRFTINFO/HRDR'
    restrictionFlag:
      query: '*/RSRD_SEQ/RSRD'
    restrictionExpiration:
      query: '*/RSRD_SEQ/EXPRSRD'
    longitude:
      query: '*/PRSLEVEL/DRFTINFO/XDR'
      transforms:
      - wrap:
        - -180.0
        - 180.0
    latitude:
      query: '*/PRSLEVEL/DRFTINFO/YDR'
    stationIdentification:
      query: '*/SID'
    observationSubTypeNum:
      query: '*/T29'
    pressureMetaData:
      query: '*/PRSLEVEL/P___INFO/P__EVENT{1}/POB'
      transforms:
      - scale: 100
    pressureQualityMarker:
      query: '*/PRSLEVEL/P___INFO/P__EVENT{1}/PQM'
    heightMetaData:
      query: '*/PRSLEVEL/Z___INFO/Z__EVENT{1}/ZOB'
      type: float
    stationElevationMetaData:
      query: '*/ELV'
      type: float
    windEastwardObsValue:
      query: '*/PRSLEVEL/W___INFO/W__EVENT{1}/UOB'
    windNorthwardObsValue:
      query: '*/PRSLEVEL/W___INFO/W__EVENT{1}/VOB'
    windEastwardQualityMarker:
      query: '*/PRSLEVEL/W___INFO/W__EVENT{1}/WQM'
    windNorthwardQualityMarker:
      query: '*/PRSLEVEL/W___INFO/W__EVENT{1}/WQM'
    windEastwardObsError:
      query: '*/PRSLEVEL/W___INFO/W__BACKG/WOE'
    windNorthwardObsError:
      query: '*/PRSLEVEL/W___INFO/W__BACKG/WOE'
encoder:
  globals:
  - name: platformCommonName
    type: string
    value: PROFLR
  - name: description
    type: string
    value: Wind profiler Reports
  - name: platformLongDescription
    type: string
    value: Wind profiler Reports in prepBUFR format
  - name: sensor
    type: string
    value: PROFLR data
  - name: source
    type: string
    value: U.S. National Weather Service, National Centers for Environmental Prediction
      (NCEP))
  - name: sourceFiles
    type: string
    value: NCEP prepBUFR - PROFLR
  - name: converter
    type: string
    value: bufr-query
  variables:
  - name: ObsType/windEastward
    source: variables/observationType
    longName: windEastward ObsType
  - name: ObsType/windNorthward
    source: variables/observationType
    longName: windNorthward ObsType
  - name: MetaData/dateTime
    source: variables/timestamp
    units: seconds since 1970-01-01T00:00:00Z
    longName: dateTime
  - name: MetaData/prepbufrDataLevelCategory
    source: variables/prepbufrDataLevelCategory
    units: '1'
    longName: Prepbufr Data Level Category
  - name: MetaData/observationSubTypeNum
    source: variables/observationSubTypeNum
    longName: Observation SubType Number
  - name: MetaData/restrictionFlag
    source: variables/restrictionFlag
    longName: Restriction on Redistribution
  - name: MetaData/restrictionExpiration
    source: variables/restrictionExpiration
    longName: Expiration of Restriction on Redistribution
  - name: MetaData/latitude
    source: variables/latitude
    longName: Latitude
    units: degree_north
    range:
    - -90
    - 90
  - name: MetaData/longitude
    source: variables/longitude
    longName: Longitude
    units: degree_east
    range:
    - -180
    - 180
  - name: MetaData/stationIdentification
    source: variables/stationIdentification
    longName: Station Identification
  - name: MetaData/pressure
    source: variables/pressureMetaData
    longName: Pressure
    units: Pa
  - name: MetaData/height
    source: variables/heightMetaData
    longName: Height
    units: m
  - name: QualityMarker/pressure
    source: variables/pressureQualityMarker
    longName: Pressure Quality Marker
  - name: MetaData/stationElevation
    source: variables/stationElevationMetaData
    longName: Station Elevation
    units: m
  - name: ObsValue/windEastward
    source: variables/windEastwardObsValue
    longName: Eastward Wind
    units: m s-1
  - name: ObsValue/windNorthward
    source: variables/windNorthwardObsValue
    longName: Northward Wind
    units: m s-1
  - name: QualityMarker/windNorthward
    source: variables/windNorthwardQualityMarker
    longName: U, V-Component of Wind Quality Marker
  - name: QualityMarker/windEastward
    source: variables/windEastwardQualityMarker
    longName: U, V-Component of Wind Quality Marker
  - name: ObsError/windEastward
    source: variables/windEastwardObsError
    longName: Eastward Wind Error
    units: m s-1
  - name: ObsError/windNorthward
    source: variables/windNorthwardObsError
    longName: Northward Wind Error
    units: m s-1
